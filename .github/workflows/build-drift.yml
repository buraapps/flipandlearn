# Build drift check
#
# index.html is the build source. build-locales.js generates the committed site from
# it: 31 locale homepages plus cookies.html, privacy.html and privacy-website.html for
# each locale (124 files), the Flip & Learn ABC page for every locale in ABC_LOCALES,
# and sitemap.xml. Those generated files are committed and served directly by GitHub
# Pages, so if someone edits a source without re-running the build, the committed
# output silently goes stale. That has happened: a nav.blog dictionary key sat unbuilt
# across 29 locales for several commits, and a German hero.sub fix reached
# de/index.html but none of the others.
#
# This job re-runs the build and fails if the result differs from what is committed.
#
# sitemap.xml is part of the check. The build keeps every URL's existing <lastmod>
# and stamps today's date only on a URL that is new (or named with --touch), so a
# plain build of an up-to-date tree reproduces the committed sitemap byte for byte.

name: Build drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Committed output matches build-locales.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # build-locales.js uses only Node built-ins (fs, path, vm) plus the local
      # privacy-strings.js. There is no package.json and no install step.
      # Pinned to 24 to match the version used locally, so CI cannot diverge from
      # a local build. Nothing else in the repo pins a Node version.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the build
        run: node build-locales.js

      - name: Compare committed output against the build
        run: |
          if git diff --quiet; then
            echo "No drift: every generated file matches build-locales.js."
            exit 0
          fi

          echo "::error::Build drift detected. Committed files do not match build-locales.js output."
          echo ""
          echo "=============================================================="
          echo " BUILD DRIFT DETECTED"
          echo "=============================================================="
          echo ""
          echo "A build source has been edited without re-running the build, so"
          echo "the committed generated files are stale."
          echo ""
          echo "Files that differ:"
          echo "--------------------------------------------------------------"
          git diff --stat
          echo ""
          echo "To fix, run this command and commit the result:"
          echo "--------------------------------------------------------------"
          echo "  node build-locales.js"
          echo ""
          echo "Full diff:"
          echo "--------------------------------------------------------------"
          git diff
          exit 1
